services:
  - type: web
    name: taskflow-crud-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString

databases:
  - name: taskflow-postgres
    plan: free
    region: oregon
    databaseName: taskflow
    user: taskflow_user
